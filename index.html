       HERO TYPING LINE
       The headline is now a fixed line ("AI Vision & AI Agent") plus a line
       that types itself through hero.type. Text comes from React; only the
       caret and the screen-reader fallback live here.
       --------------------------------------------------------------------- */
    .hero-title { text-wrap: balance; }   /* wrap as "AI Vision" / "& AI Agent" */

    @keyframes caretBlink { 0%, 45% { opacity: 1; } 55%, 100% { opacity: 0; } }
    .type-caret {
      display: inline-block;
      width: 0.055em;
      min-width: 2px;
      height: 0.78em;
      margin-left: 0.07em;
      vertical-align: -0.06em;
      background: var(--step, #ff3a1a);
      transition: background-color .45s ease;
      animation: caretBlink 1.05s steps(1, end) infinite;
    }

    /* ---------------------------------------------------------------------
       PERCEPTION -> REASONING -> ACTION
       The three typed words are the three stages of what this company
       actually builds, so each one carries its own colour: sensing is cool,
       reasoning is violet, acting is the brand vermilion. Only ever one hue
       on screen at a time, so the hero gains focus without turning into a
       rainbow. Every value below is tuned to land within half a contrast
       point of its siblings (~5.0 on cream, ~6.6 on near-black), so the
       headline does not visibly change weight as it cycles.
       --------------------------------------------------------------------- */
    .type-line {
      --step: #d92b0c;
      color: var(--step);
      transition: color .45s ease;
    }
    .type-line.step-0 { --step: #0b7285; }   /* see   - 5.13:1 on #f7f5f2 */
    .type-line.step-1 { --step: #7c3aed; }   /* think - 5.24:1 */
    .type-line.step-2 { --step: #d92b0c; }   /* act   - 4.49:1, brand red */

    .dark .type-line.step-0 { --step: #0ea5e9; }   /* 6.81:1 on #121110 */
    .dark .type-line.step-1 { --step: #a78bfa; }   /* 6.93:1 */
    .dark .type-line.step-2 { --step: #ff5c3d; }   /* 6.15:1 */

    /* Dark ground only: a wide, very faint bloom reads as depth on black.
       On cream the same effect just looks like a printing error. */
    .dark .type-line {
      text-shadow: 0 0 38px color-mix(in srgb, var(--step) 28%, transparent);
    }

    /* ---------------------------------------------------------------------
       CHIP MARK
       Body and pins take currentColor so the mark inverts with the theme;
       only the die is fixed brand red, which reads on both grounds. The
       letter A and the square frame gap are knocked out through a mask, so
       the page background shows through and nothing needs a per-theme fill.
       --------------------------------------------------------------------- */
    .chip-pin { fill: currentColor; }
    .chip-die { fill: #ff3a1a; transform-origin: 16px 16px; }

    /* A pulse walks pin to pin, then the die answers it - the mark reads as
       signal arriving and being processed, which is what the company sells.
       16 pins x 88ms stagger = one lap per 1.4s inside a 3.2s cycle, so it
       runs, rests, and runs again instead of buzzing nonstop in the header. */
    @keyframes chipPin { 0%, 6% { fill: #ff3a1a; } 20%, 100% { fill: currentColor; } }
    @keyframes chipDie { 0%, 100% { opacity: 1; transform: scale(1); }
                         50%      { opacity: .72; transform: scale(.94); } }

    .chip-pin { animation: chipPin 3.2s linear infinite; }
    .chip-die { animation: chipDie 3.2s ease-in-out infinite; }

    /* A logo that never stops moving is noise in a sticky header, and some
       people get motion sick from it. Both animations are decorative - the
       mark is complete standing still. */
    @media (prefers-reduced-motion: reduce) {
      .chip-pin, .chip-die { animation: none; }
    }

    /* ---------------------------------------------------------------------
       LANGUAGE PICKER
       Three flags in a row read as three competing controls; as a dropdown
       it is one control showing one answer. The menu also gets room for the
       language NAME, which the row could not fit - and a flag alone is a
       country, not a language, so the name is what actually tells a first
       time visitor what they are picking.

       Flags are inline SVG, deliberately not emoji: Windows ships no flag
       glyphs, so emoji flags fall back to boxed country letters ("VN", "GB")
       for a large share of visitors - the one platform you would never catch
       it on while building from a Mac.
       --------------------------------------------------------------------- */
    .flag {
      display: block;
      border-radius: 2px;
      /* Japan is a white field on a white surface and would otherwise have
         no edge at all, so every flag carries a hairline. */
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .20);
    }
    .dark .flag { box-shadow: 0 0 0 1px rgba(255, 255, 255, .26); }

    /* Team portraits. Sized here rather than with Tailwind because the
       compiled build in this file has no w-16/h-16 utilities. */
    .team-avatar {
      width: 64px; height: 64px; border-radius: 50%;
      object-fit: cover; display: block;
      background: #f7f5f2;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .10);
    }
    .dark .team-avatar {
      background: #121110;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .14);
    }

    /* ---------------------------------------------------------------------
       FOOTER
       Laid out with these rules rather than Tailwind gap utilities: the
       pre-compiled build in this file ships only some of them, and a missing
       one fails silently as gap:0 - which is exactly how the privacy link and
       the address ended up glued together.
       --------------------------------------------------------------------- */
    .footer-row {
      display: flex; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: 18px 30px;
    }
    .footer-brand { display: flex; align-items: center; gap: 12px; }
    .footer-id { display: flex; flex-direction: column; gap: 4px; }
    .footer-mail { align-self: flex-start; }
    .footer-links { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; }

    .footer-link {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 12px; color: #6b6763; transition: color .18s ease;
    }
    .dark .footer-link { color: #9a9590; }
    .footer-link:hover { color: #121110; }
    .dark .footer-link:hover { color: #fff; }

    /* ---------------------------------------------------------------------
       PARTNER BAND
       ToolGo is a different company, so it gets its own strip rather than a
       slot among our links: a rule above it AND a recessed ground (the page
       colour, one step back from the footer's own white) so the boundary
       reads even before you look at the logo.
       --------------------------------------------------------------------- */
    .footer-partner {
      border-top: 1px solid #e8e2db;
      background: #f7f5f2;
      padding: 15px 20px;
      display: flex; flex-wrap: wrap; align-items: center;
      justify-content: center; gap: 10px 14px;
    }
    .dark .footer-partner { border-top-color: #2a2826; background: #121110; }

    .tg-label {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
      color: #6b6763;
    }
    .dark .tg-label { color: #9a9590; }

    /* ToolGo's mark is drawn for their cream page: its rust line work all but
       disappears on a dark ground and the sage shapes flatten to one blob, so
       the lockup keeps its own background instead of being recoloured - a
       partner's brand is not ours to restyle. Shipped at 3x as an image so
       their Sora wordmark stays exact without loading a font for one word. */
    .tg-link { display: inline-flex; align-items: center; gap: 10px; }
    .tg-lockup {
      display: block; width: 112px; height: 30px; border-radius: 6px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .07);
    }
    .dark .tg-lockup { box-shadow: none; }
    .tg-arrow {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 12px; color: #6b6763; transition: color .18s ease;
    }
    .dark .tg-arrow { color: #9a9590; }
    .tg-link:hover .tg-arrow, .tg-link:hover .tg-label { color: #121110; }
    .dark .tg-link:hover .tg-arrow, .dark .tg-link:hover .tg-label { color: #fff; }
    .tg-label { transition: color .18s ease; }
    .tg-link:focus-visible { outline: 2px solid #ff3a1a; outline-offset: 3px; border-radius: 8px; }

    /* ---------------------------------------------------------------------
       UTILITIES MISSING FROM THE PRE-COMPILED TAILWIND BUILD
       Found by diffing every class the JSX hands to React against the CSS
       actually shipped in this file. Each of these was silently doing
       nothing. Written as attribute selectors so no character needs
       escaping through the template literal this stylesheet lives in.
       --------------------------------------------------------------------- */
    [class~="whitespace-nowrap"] { white-space: nowrap; }
    [class~="px-3.5"] { padding-left: .875rem; padding-right: .875rem; }
    [class~="opacity-[0.18]"] { opacity: .18; }
    [class~="w-[calc(100%-1.5rem)]"] { width: calc(100% - 1.5rem); }
    [class~="h-[calc(100%-1.5rem)]"] { height: calc(100% - 1.5rem); }

    /* ---------------------------------------------------------------------
       CONSENT BAR
       Sits above everything (the mobile CTA bar is z-40, the nav z-50, the
       mobile sheet z-60, the language menu z-70) because nothing should be
       usable-looking before the choice is made.
       The two buttons share one footprint on purpose: the law is specific
       that refusing must be exactly as easy as accepting, so they are the
       same height, width and weight, one click each, side by side.
       --------------------------------------------------------------------- */
    .consent-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
      padding-top: 16px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      background: #fff; border-top: 1px solid #e8e2db;
      box-shadow: 0 -8px 28px rgba(18, 17, 16, .10);
    }
    /* The band spans the window, but its contents share the page container so
       the text starts on the same line as the footer above it. Without this,
       on a wide monitor the message and the buttons end up at opposite edges
       of the screen with a gulf between them. Padding matches px-5 md:px-8. */
    .consent-inner {
      max-width: 1280px; margin: 0 auto;
      padding-inline: 20px;
      display: flex; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: 14px 24px;
    }
    @media (min-width: 768px) { .consent-inner { padding-inline: 32px; } }
    .dark .consent-bar {
      background: #1a1918; border-top-color: #2a2826;
      box-shadow: 0 -8px 28px rgba(0, 0, 0, .5);
    }

    .consent-text {
      margin: 0; font-size: 13px; line-height: 1.55;
      color: #3f3c39; max-width: 76ch;
    }
    .dark .consent-text { color: #c8c3be; }
    .consent-link { color: #121110; text-decoration: underline; text-underline-offset: 2px; }
    .dark .consent-link { color: #f7f5f2; }

    .consent-actions { display: flex; gap: 10px; flex: none; }
    .consent-btn {
      appearance: none; cursor: pointer;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
      height: 40px; min-width: 120px; padding: 0 18px; border-radius: 999px;
      transition: opacity .18s ease;
    }
    .consent-no  { background: transparent; border: 1px solid #d6d0c9; color: #121110; }
    .dark .consent-no { border-color: #3a3734; color: #f7f5f2; }
    .consent-yes { background: #ff3a1a; border: 1px solid #ff3a1a; color: #fff; }
    .consent-btn:hover { opacity: .88; }
    .consent-btn:focus-visible { outline: 2px solid #ff3a1a; outline-offset: 2px; }

    @media (max-width: 640px) {
      .consent-actions { width: 100%; }
      .consent-btn { flex: 1; min-width: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .consent-btn { transition: none; } }

    /* Honeypot. Off-screen rather than display:none, because some bots skip
       hidden inputs but happily fill one they can "see" in the DOM. */
    .hp-field {
      position: absolute; left: -9999px; width: 1px; height: 1px;
      opacity: 0; pointer-events: none;
    }
    [class~="disabled:opacity-60"]:disabled { opacity: .6; cursor: default; }

    .lang-wrap { position: relative; }

    .lang-trigger {
      display: inline-flex; align-items: center; gap: 7px;
      height: 30px; padding: 0 8px;
      border: 1px solid #e8e2db; border-radius: 999px;
      background: #fff; cursor: pointer;
      transition: border-color .18s ease, background-color .18s ease;
    }
    .dark .lang-trigger { border-color: #2a2826; background: #1a1918; }
    .lang-trigger:hover { border-color: #d6d0c9; }
    .dark .lang-trigger:hover { border-color: #3a3734; }
    .lang-trigger:focus-visible { outline: 2px solid #ff3a1a; outline-offset: 2px; }
    .lang-trigger[aria-expanded="true"] {
      border-color: rgba(255, 58, 26, .45);
      background: rgba(255, 58, 26, .09);
    }
    .dark .lang-trigger[aria-expanded="true"] {
      border-color: rgba(255, 58, 26, .50);
      background: rgba(255, 58, 26, .16);
    }

    .lang-caret { color: #6b6763; transition: transform .18s ease; }
    .dark .lang-caret { color: #9a9590; }
    .lang-trigger[aria-expanded="true"] .lang-caret { transform: rotate(180deg); }

    .lang-menu {
      position: absolute; top: calc(100% + 8px); right: 0;
      z-index: 70;   /* the nav itself is z-50; the mobile sheet is z-60 */
      margin: 0; padding: 5px; list-style: none; min-width: 176px;
      border: 1px solid #e8e2db; border-radius: 12px; background: #fff;
      box-shadow: 0 14px 34px rgba(18, 17, 16, .14), 0 2px 6px rgba(18, 17, 16, .07);
    }
    .dark .lang-menu {
      border-color: #2a2826; background: #1a1918;
      box-shadow: 0 14px 34px rgba(0, 0, 0, .55), 0 2px 6px rgba(0, 0, 0, .4);
    }
    .lang-menu li { display: block; }

    .lang-item {
      width: 100%; display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border: 0; border-radius: 8px; background: transparent;
      cursor: pointer; text-align: left;
      font-size: 13px; font-weight: 500; color: #3f3c39;
      transition: background-color .14s ease;
    }
    .dark .lang-item { color: #c8c3be; }
    .lang-item:hover { background: rgba(0, 0, 0, .05); }
    .dark .lang-item:hover { background: rgba(255, 255, 255, .07); }
    .lang-item:focus-visible { outline: 2px solid #ff3a1a; outline-offset: -2px; }
    .lang-item.is-current {
      background: rgba(255, 58, 26, .11); color: #121110; font-weight: 600;
    }
    .dark .lang-item.is-current { background: rgba(255, 58, 26, .18); color: #f7f5f2; }

    .lang-name { white-space: nowrap; }

    @media (prefers-reduced-motion: reduce) {
      .lang-trigger, .lang-caret, .lang-item { transition: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .type-caret { animation: none; }
      .type-line, .type-caret { transition: none; }
    }

    @keyframes scanY { 0% { top: 0%; opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
    .scanline {
      position: absolute; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,58,26,0.95), transparent);
      box-shadow: 0 0 18px rgba(255,58,26,0.65);
      animation: scanY 3.6s linear infinite;
      pointer-events: none;
    }
    @media (prefers-reduced-motion: reduce) { .scanline { animation: none; opacity: 0; } }
    .px-3\\.5 { padding-left: 0.875rem; padding-right: 0.875rem; }
    @media (min-width: 1024px) {
      .lg\\:hidden { display: none; }
      .lg\\:inline { display: inline; }
      .lg\\:px-5 { padding-left: 1.25rem; padding-right: 1.25rem; }
      .lg\\:gap-7 { gap: 1.75rem; }
    }

    /* =====================================================================
       VIETNAMESE (VI) TYPOGRAPHY LAYER
       Vietnamese stacks a tone mark above a vowel diacritic, so glyphs are
       taller than Latin and sub-1.0 line-height makes them touch.
       ===================================================================== */
    html[lang="vi"] [class*="leading-[0."]  { line-height: 1.16 !important; }
    html[lang="vi"] h1 { line-height: 1.14 !important; }
    /* Latin headlines run longer than the JA one; the fixed 42px mobile
       size pushed them onto a fourth line on narrow phones */
    @media (max-width: 767px) {
      html[lang="vi"] h1,
      html[lang="en"] h1 { font-size: clamp(26px, 8.4vw, 40px) !important; }
    }
    /* The GenAI heading is meant to break as two lines. Its column narrows
       sharply at the lg breakpoint and on phones, so scale the type there
       instead of letting the second line wrap. */
    @media (max-width: 767px) {
      html[lang="vi"] #genai h2 { font-size: clamp(21px, 6.8vw, 32px) !important; }
    }
    @media (min-width: 1024px) and (max-width: 1279px) {
      html[lang="vi"] #genai h2 { font-size: 32px !important; }
    }

    /* at exactly 1024px the hero splits into two columns, so the headline
       suddenly has half the width at the full 62px size */
    @media (min-width: 768px) and (max-width: 1279px) {
      html[lang="vi"] h1,
      html[lang="en"] h1 { font-size: clamp(36px, 4.6vw, 56px) !important; }
    }
    html[lang="vi"] h2, html[lang="vi"] h3 { line-height: 1.22 !important; }
    html[lang="vi"] [class*="leading-[1.05]"] { line-height: 1.25 !important; }

    /* =====================================================================
       ENGLISH (EN) TYPOGRAPHY LAYER
       Only active when <html lang="en">. VI / JA rendering is untouched.

       PRODUCTION NOTE - the display font is NOT wired up yet.
       No webfont named "Quill Sans Display" exists on Google Fonts, Adobe
       Fonts, Fontshare or Bunny Fonts, so nothing can deliver it to a
       visitor. Until a real font file is added, this rule is a deliberate
       no-op: it resolves to "Archivo" - the font the rest of the site
       already loads - so EN renders consistently instead of dropping to
       whatever sans-serif each visitor's OS happens to ship.

       To switch EN to a real display font in production:
         1. Load it in <head>: either add the family to the existing Google
            Fonts @import above, or self-host the licensed file -
              @font-face { font-family:"<Name>";
                           src:url("fonts/<Name>.woff2") format("woff2");
                           font-weight:400 800; font-display:swap; }
         2. Put it first in the stack below, keeping "Archivo" as fallback.
       ===================================================================== */
    html[lang="en"] *,
    html[lang="en"] *::before,
    html[lang="en"] *::after {
      font-family: "Quill Sans Display", "Archivo", sans-serif;
    }

    /* =====================================================================
       JAPANESE (JA) TYPOGRAPHY LAYER
       Only active when <html lang="ja">. VI / EN rendering is untouched.
       Fixes: missing JA glyphs -> ugly fallback, negative letter-spacing,
       sub-1.0 line-height (lines touching), 9-11px text, bad line breaks.
       ===================================================================== */

    /* 2.1  Glyph coverage. Archivo / JetBrains Mono have no kana or kanji,
            so JA fell back to an arbitrary system font. Pin the stack. */
    html[lang="ja"] *,
    html[lang="ja"] *::before,
    html[lang="ja"] *::after {
      font-family: "Archivo", "Noto Sans JP", "Hiragino Kaku Gothic ProN",
                   "Hiragino Sans", "Yu Gothic", "YuGothic", Meiryo, sans-serif;
      /* proportional kana/punctuation: removes the huge gaps after 。、） */
      font-feature-settings: "palt" 1;
    }
    html[lang="ja"] .mono {
      font-family: "JetBrains Mono", "Noto Sans JP", "Hiragino Kaku Gothic ProN",
                   "Yu Gothic", Meiryo, monospace !important;
      letter-spacing: 0.04em !important;   /* 0.08-0.16em is too airy for kana */
    }

    /* 2.2  Line breaking. Japanese has no spaces, so the browser breaks
            anywhere; keep kinsoku rules and break on phrase boundaries. */
    html[lang="ja"] {
      /* normal (not strict) lets long katakana runs such as
         コンピュータビジョン break before ー / small kana instead of
         becoming one unbreakable 380px word that overflows on mobile. */
      line-break: normal;
      word-break: normal;
      overflow-wrap: break-word;
    }
    html[lang="ja"] h1,
    html[lang="ja"] h2,
    html[lang="ja"] h3,
    html[lang="ja"] p,
    html[lang="ja"] li {
      text-wrap: pretty;
    }
    @supports (word-break: auto-phrase) {
      html[lang="ja"] h1,
      html[lang="ja"] h2,
      html[lang="ja"] h3,
      html[lang="ja"] p {
        word-break: auto-phrase;   /* breaks between 文節, not mid-word */
      }
    }

    /* 2.3  Kill negative tracking. -0.02em..-0.04em is fine for Latin,
            but it makes kanji physically collide. */
    html[lang="ja"] [class*="tracking-[-"] {
      letter-spacing: 0 !important;
    }

    /* 2.4  Line-height. leading-[0.9]..[0.95] made JA lines overlap. */
    html[lang="ja"] [class*="leading-[0."]  { line-height: 1.34 !important; }
    html[lang="ja"] [class*="leading-[1.05]"],
    html[lang="ja"] [class*="leading-[1.25]"],
    html[lang="ja"] [class*="leading-[1.3]"],
    html[lang="ja"] [class*="leading-[1.4]"] { line-height: 1.6 !important; }
    html[lang="ja"] [class*="leading-[1.5]"],
    html[lang="ja"] [class*="leading-[1.6]"] { line-height: 1.85 !important; }
    html[lang="ja"] p  { line-height: 1.85; }
    html[lang="ja"] h1 { line-height: 1.34 !important; }
    html[lang="ja"] h2,
    html[lang="ja"] h3 { line-height: 1.45 !important; }

    /* 2.5  Minimum readable size. A 10px kanji is a smudge; Latin at 10px
            is still legible, which is why this only applies to JA. */
    html[lang="ja"] [class*="text-[8px]"]  { font-size: 11px !important; }
    html[lang="ja"] [class*="text-[9px]"]  { font-size: 11px !important; }
    html[lang="ja"] [class*="text-[10px]"] { font-size: 12px !important; }
    html[lang="ja"] [class*="text-[11px]"] { font-size: 12px !important; }
    html[lang="ja"] [class*="text-[12px]"] { font-size: 13px !important; }
    html[lang="ja"] [class*="text-[13px]"] { font-size: 13.5px !important; }
    /* the VI / EN / JA switcher is Latin-only: keep it at its original size
       so the header row does not overflow on 320px screens */
    html[lang="ja"] [aria-label^="Switch to"] {
      font-size: 11px !important;
      padding-left: 0.625rem;
      padding-right: 0.625rem;
      letter-spacing: 0.06em !important;
    }

    /* 2.6  Display headings: JA characters are full-width, so the same
            string is ~1.8x wider than EN and wrapped badly. Step down. */
    html[lang="ja"] h1 { font-size: clamp(24px, 7.2vw, 34px) !important; }
    html[lang="ja"] [class*="text-[32px]"] { font-size: clamp(22px, 6.4vw, 27px) !important; }
    html[lang="ja"] [class*="text-[28px]"] { font-size: clamp(20px, 5.8vw, 25px) !important; }
    @media (min-width: 768px) {
      html[lang="ja"] h1 { font-size: 50px !important; }
      html[lang="ja"] [class*="md:text-[44px]"],
      html[lang="ja"] [class*="md:text-[42px]"] { font-size: 36px !important; }
      html[lang="ja"] [class*="md:text-[26px]"] { font-size: 24px !important; }
    }

    /* 2.7  Fixed-height pills/buttons: taller JA line-height would clip or
            overflow them. Convert height -> min-height. */
    html[lang="ja"] .h-7 { height: auto !important; min-height: 1.75rem; }
    html[lang="ja"] .h-8 { height: auto !important; min-height: 2rem; }
    html[lang="ja"] [class*="h-[52px]"] { height: auto !important; min-height: 52px; padding-top: 10px; padding-bottom: 10px; }
    html[lang="ja"] [class*="h-[48px]"] { height: auto !important; min-height: 48px; }
